name: NRO referral build and SQL smoke

on:
  push:
    branches: [feature/nro-event-referral-kame]
  pull_request:
    paths:
      - "Nro_Yanii-a443509f203eb21b7f39bb5a5234df4b1ddcfbea/**"
      - "database/migrations/20261028_referral*.sql"
      - ".github/workflows/nro-referral-ci.yml"
      - "scripts/test_nro_referral_contract.py"
      - "scripts/test_referral_costume_migration.py"
      - "scripts/test_november_event_migration.py"
      - "scripts/test_nro_login_smoke.py"

jobs:
  build-server:
    name: Compile NRO Server / JDK 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: Nro_Yanii-a443509f203eb21b7f39bb5a5234df4b1ddcfbea/Server/pom.xml
      - name: Maven package including Java compilation
        working-directory: Nro_Yanii-a443509f203eb21b7f39bb5a5234df4b1ddcfbea/Server
        run: mvn -B -ntp clean package
      - name: Contract tests
        run: |
          python3 scripts/test_nro_referral_contract.py
          python3 scripts/test_referral_costume_migration.py
          python3 scripts/test_november_event_migration.py

  sql-migration:
    name: MariaDB 10.11 migration smoke
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-not-production
          MARIADB_DATABASE: ngocrong
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install DB driver
        run: python -m pip install pymysql
      - name: Check schema constraints and milestone accounting
        env:
          NRO_SQL_HOST: 127.0.0.1
          NRO_SQL_PASSWORD: ci-not-production
        run: |
          python3 scripts/test_nro_referral_contract.py --db
          python3 scripts/test_referral_costume_migration.py --db
          python3 scripts/test_november_event_migration.py --db
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            Nro_Yanii-a443509f203eb21b7f39bb5a5234df4b1ddcfbea/Login/pom.xml
            Nro_Yanii-a443509f203eb21b7f39bb5a5234df4b1ddcfbea/Server/pom.xml
      - name: Build Login and Game Server from source
        run: |
          mvn -B -ntp -f Nro_Yanii-a443509f203eb21b7f39bb5a5234df4b1ddcfbea/Login/pom.xml clean package
          mvn -B -ntp -f Nro_Yanii-a443509f203eb21b7f39bb5a5234df4b1ddcfbea/Server/pom.xml clean package
      - name: Real authentication, catalog transfer and character entry
        env:
          NRO_SQL_PASSWORD: ci-not-production
        run: python3 scripts/test_nro_login_smoke.py
